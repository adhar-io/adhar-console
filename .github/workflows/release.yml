name: Release

# Build + publish the multi-arch adhar-console image AND cut a GitHub Release.
# This is the single publisher for the project.
#
# Registries:
#   - GHCR  (ghcr.io/<owner>/adhar-console) — ALWAYS. Authenticates with the
#     built-in GITHUB_TOKEN, so it needs zero setup.
#   - Docker Hub (<user>/adhar-console) — ONLY when the DOCKERHUB_USERNAME /
#     DOCKERHUB_TOKEN secrets are set. Skipped cleanly otherwise.
#
# Triggers:
#   - pushing a semver tag `v*` (e.g. v0.3.1) → the full release: image tags
#     :<version>, :<major.minor>, :<major>, :latest, :sha-<short> + a GitHub
#     Release with auto-generated notes.
#   - manual dispatch with an explicit version → publishes the image only.
#
# Cut a release the easy way with the "Version bump" workflow.
#
# Optional repository secrets:
#   DOCKERHUB_USERNAME  — Docker Hub account/org (also the image namespace, e.g. adhario)
#   DOCKERHUB_TOKEN     — Docker Hub access token with Read/Write scope
#   ADHAR_UI_TOKEN      — PAT to check out adhar-io/adhar-ui if private
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: Version to publish (e.g. 0.3.1) — image only, no GitHub Release
        required: true

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write # create the GitHub Release
  packages: write # push to GHCR

jobs:
  publish:
    name: Build · push · release
    runs-on: ubuntu-latest
    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
    outputs:
      version: ${{ steps.version.outputs.version }}
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - name: Checkout adhar-console
        uses: actions/checkout@v4
        with:
          path: adhar-console
          fetch-depth: 0 # full history so release notes can diff against the last tag

      - name: Checkout adhar-ui (build context)
        uses: actions/checkout@v4
        with:
          repository: adhar-io/adhar-ui
          path: adhar-ui
          token: ${{ secrets.ADHAR_UI_TOKEN || github.token }}

      - name: Resolve version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          VERSION="${VERSION#v}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Publishing adhar-console ${VERSION}"

      - name: Resolve registries
        id: reg
        run: |
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          GHCR="ghcr.io/${OWNER}/adhar-console"
          echo "ghcr=${GHCR}" >> "$GITHUB_OUTPUT"
          {
            echo "images<<EOF"
            echo "${GHCR}"
            if [ -n "${DOCKERHUB_USERNAME}" ]; then echo "${DOCKERHUB_USERNAME}/adhar-console"; fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
          if [ -n "${DOCKERHUB_USERNAME}" ]; then
            echo "Publishing to: ${GHCR} + ${DOCKERHUB_USERNAME}/adhar-console"
          else
            echo "Publishing to: ${GHCR} (Docker Hub secrets not set — skipping)"
          fi

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Log in to Docker Hub
        if: ${{ env.DOCKERHUB_USERNAME != '' }}
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ env.DOCKERHUB_TOKEN }}

      - name: Guard — version not already published
        if: github.event_name == 'push'
        env:
          VERSION: ${{ steps.version.outputs.version }}
          GHCR: ${{ steps.reg.outputs.ghcr }}
          SHA: ${{ github.sha }}
        run: |
          # A published semver tag is immutable — fail early rather than clobber.
          #
          # "Already published" is not the same as "published from somewhere
          # else", though. This job pushes the image BEFORE it cuts the GitHub
          # Release, so a failure in between leaves the version half-released:
          # the image exists, the Release does not, and re-running the tag used
          # to be refused right here — the version became permanently
          # unreleasable and the only way out was to bump. (That is exactly what
          # happened to v0.1.71.)
          #
          # So the guard asks the sharper question: was this image built from
          # THIS commit? Same commit means a retry, and re-pushing identical
          # content is a no-op. A different commit is the real violation.
          if ! docker buildx imagetools inspect "${GHCR}:${VERSION}" >/dev/null 2>&1; then
            echo "Version ${VERSION} is free — proceeding."
            exit 0
          fi
          # Every build also publishes a `sha-<short>` tag. Comparing the two
          # digests answers "same commit?" with two plain manifest lookups —
          # more robust than digging labels out of a multi-arch index, where
          # they live on the per-platform configs rather than the index itself.
          SHORT="${SHA:0:7}"
          VER_DIGEST=$(docker buildx imagetools inspect "${GHCR}:${VERSION}" --format '{{.Manifest.Digest}}' 2>/dev/null || true)
          SHA_DIGEST=$(docker buildx imagetools inspect "${GHCR}:sha-${SHORT}" --format '{{.Manifest.Digest}}' 2>/dev/null || true)
          if [ -n "${VER_DIGEST}" ] && [ "${VER_DIGEST}" = "${SHA_DIGEST}" ]; then
            echo "::notice::${GHCR}:${VERSION} was already built from ${SHA} — retrying the rest of the release."
            exit 0
          fi
          echo "::error::${GHCR}:${VERSION} already exists and was not built from ${SHA}. Bump the version."
          exit 1

      - name: Derive image + tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.reg.outputs.images }}
          tags: |
            type=semver,pattern={{version}},value=${{ steps.version.outputs.version }}
            type=semver,pattern={{major}}.{{minor}},value=${{ steps.version.outputs.version }}
            type=semver,pattern={{major}},value=${{ steps.version.outputs.version }},enable=${{ !startsWith(steps.version.outputs.version, '0.') }}
            type=sha,format=short
            type=raw,value=latest,enable=${{ github.ref_type == 'tag' }}
          labels: |
            org.opencontainers.image.title=Adhar Console
            org.opencontainers.image.description=Kubernetes-native SDLC control plane for the Adhar platform
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
            org.opencontainers.image.vendor=Adhar

      - name: Build + push (amd64 + arm64)
        id: build
        uses: docker/build-push-action@v6
        with:
          context: adhar-console
          file: adhar-console/deploy/Dockerfile
          build-contexts: |
            adhar-ui=${{ github.workspace }}/adhar-ui
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Bake the release version into the image (Dockerfile ARG → ENV) so
          # /api/config reports the real build instead of a hardcoded fallback.
          build-args: |
            ADHAR_CONSOLE_VERSION=${{ steps.version.outputs.version }}
          provenance: true
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Create GitHub Release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          GHCR: ${{ steps.reg.outputs.ghcr }}
          DIGEST: ${{ steps.build.outputs.digest }}
          TAG: ${{ github.ref_name }}
        working-directory: adhar-console
        run: |
          MINOR="${VERSION%.*}"
          NOTES_FILE="$(mktemp)"
          {
            echo "## Container image"
            echo
            echo '```'
            echo "docker pull ${GHCR}:${VERSION}"
            echo '```'
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| **Image (GHCR)** | \`${GHCR}:${VERSION}\` |"
            if [ -n "${DOCKERHUB_USERNAME}" ]; then
              echo "| **Image (Docker Hub)** | \`${DOCKERHUB_USERNAME}/adhar-console:${VERSION}\` |"
            fi
            echo "| **Also tagged** | \`${MINOR}\`, \`latest\` |"
            echo "| **Platforms** | linux/amd64, linux/arm64 |"
            echo "| **Digest** | \`${DIGEST}\` |"
            echo
          } > "$NOTES_FILE"
          # The image is already pushed by the time we get here, so a failure in
          # this step half-releases the version. Three things follow from that:
          #
          #  1. Say WHY it failed. `gh` writes its reason to stderr and the step
          #     used to surface nothing but "exit code 1", which is what made
          #     v0.1.71 undiagnosable after the fact.
          #  2. Never lose the Release because the CHANGELOG could not be built.
          #     `--generate-notes` calls a separate API that can fail on its own;
          #     the image table below is the part that matters, so fall back to
          #     publishing without the auto-changelog rather than not at all.
          #  3. Be idempotent. A retry of a tag whose Release already exists
          #     should update it, not fail.
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "::notice::Release $TAG already exists — updating it."
            gh release edit "$TAG" --title "adhar-console ${VERSION}" --notes-file "$NOTES_FILE"
            exit 0
          fi

          # --generate-notes appends the commit/PR changelog since the last tag.
          if ERR=$(gh release create "$TAG" \
                --title "adhar-console ${VERSION}" \
                --notes-file "$NOTES_FILE" \
                --generate-notes \
                --verify-tag 2>&1); then
            echo "$ERR"
            exit 0
          fi
          echo "$ERR"
          echo "::warning::gh release create failed with auto-generated notes: ${ERR}"
          echo "Retrying without --generate-notes."
          if ERR2=$(gh release create "$TAG" \
                --title "adhar-console ${VERSION}" \
                --notes-file "$NOTES_FILE" \
                --verify-tag 2>&1); then
            echo "$ERR2"
            echo "::notice::Released $TAG without the auto-generated changelog."
            exit 0
          fi
          echo "$ERR2"
          echo "::error::Could not create release $TAG: ${ERR2}"
          exit 1

      - name: Job summary
        if: always()
        env:
          VERSION: ${{ steps.version.outputs.version }}
          GHCR: ${{ steps.reg.outputs.ghcr }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          {
            echo "### 🚀 adhar-console ${VERSION}"
            echo
            echo "- **GHCR:** \`${GHCR}:${VERSION}\`"
            if [ -n "${DOCKERHUB_USERNAME}" ]; then
              echo "- **Docker Hub:** \`${DOCKERHUB_USERNAME}/adhar-console:${VERSION}\`"
            else
              echo "- **Docker Hub:** _skipped (no secrets)_"
            fi
            echo "- **Digest:** \`${DIGEST:-n/a}\`"
            echo "- **Trigger:** ${{ github.event_name }} (${{ github.ref_name }})"
          } >> "$GITHUB_STEP_SUMMARY"
