name: Release

# Build and publish the multi-arch adhar-console image to Docker Hub.
# Triggers:
#   - pushing a semver tag `v*` (e.g. v0.2.0) → tags :<version>, :<major.minor>, :latest
#   - manual dispatch with an explicit tag input
#
# Required repository secrets:
#   DOCKERHUB_USERNAME  — Docker Hub account/org (also the image namespace)
#   DOCKERHUB_TOKEN     — Docker Hub access token with write scope
#   ADHAR_UI_TOKEN      — (optional) PAT to check out adhar-io/adhar-ui if private
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Image tag to publish (e.g. 0.2.0)
        required: true

permissions:
  contents: read

jobs:
  publish:
    name: Build + push to Docker Hub
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: adhar-console

      - name: Check out adhar-ui (build context)
        uses: actions/checkout@v4
        with:
          repository: adhar-io/adhar-ui
          path: adhar-ui
          token: ${{ secrets.ADHAR_UI_TOKEN || github.token }}

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Derive image + tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/adhar-console
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=${{ github.event.inputs.tag }},enable=${{ github.event_name == 'workflow_dispatch' }}
            type=raw,value=latest,enable=${{ github.ref_type == 'tag' }}

      - name: Build + push (amd64 + arm64)
        uses: docker/build-push-action@v6
        with:
          context: adhar-console
          file: adhar-console/deploy/Dockerfile
          build-contexts: |
            adhar-ui=adhar-ui
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
