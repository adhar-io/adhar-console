apiVersion: v1
kind: ConfigMap
metadata:
  name: adhar-console-config
  namespace: adhar-console
  labels:
    app.kubernetes.io/name: adhar-console
data:
  # In-cluster K8s API access is auto-discovered from the pod SA token; no
  # kubeconfig required. The apiserver is reached at the well-known service host
  # and the SA CA (mounted by Kubernetes) is trusted via DENO_CERT (see the
  # Deployment). Point K8S_API_URL elsewhere for out-of-cluster / multi-cluster.
  K8S_API_URL: "https://kubernetes.default.svc"

  # Auth / SSO (non-secret parts; the client secret + cookie secret live in the
  # Secret). AUTH_PUBLIC_URL must match the console's external ingress host so
  # the OIDC redirect_uri registered in Keycloak lines up.
  KEYCLOAK_URL: "https://keycloak.adhar.localtest.me:8443"
  # In-cluster backchannel for server-side OIDC (discovery/token/JWKS). The
  # public KEYCLOAK_URL above isn't routable from inside the cluster
  # (split-horizon DNS behind the gateway), so server-to-server calls use the
  # Keycloak Service directly. Tokens' issuer + browser redirects stay public.
  KEYCLOAK_INTERNAL_URL: "http://keycloak.adhar-system.svc.cluster.local:8080"
  KEYCLOAK_REALM: "adhar"
  KEYCLOAK_CLIENT_ID: "adhar-console"
  AUTH_PUBLIC_URL: "https://console.adhar.localtest.me:8443"
  AUTH_SCOPES: "openid profile email offline_access"
  AUTH_COOKIE_SECURE: "true"
  # Sliding 8h session, hard 24h ceiling before a fresh interactive login.
  AUTH_SESSION_TTL_SECONDS: "28800"
  AUTH_SESSION_ABSOLUTE_TTL_SECONDS: "86400"
  ADHAR_CONSOLE_VERSION: "0.3.0"

  # AI assistant (self-hosted / OpenAI-compatible). Leave AI_BASE_URL empty to
  # disable AI. Point it at an in-cluster OpenAI-compatible endpoint (vLLM,
  # Ollama /v1, LiteLLM, LocalAI). The API key (if any) lives in the Secret.
  AI_BASE_URL: ""
  AI_MODEL: "default"
  GITEA_URL: "https://gitea.adhar.localtest.me:8443"
  ARGOCD_URL: "https://argocd.adhar.localtest.me:8443"
  KARGO_URL: "https://kargo.adhar.localtest.me:8443"
  HARBOR_URL: "https://harbor.adhar.localtest.me:8443"
  PLANE_URL: "https://plane.adhar.localtest.me:8443"
  ARGO_WORKFLOWS_URL: "https://argo-workflows.adhar.localtest.me:8443"
  ARGO_ROLLOUTS_URL: "https://rollouts.adhar.localtest.me:8443"

  # Component scaffolder (Catalog → Create): org for new + template repos, and
  # where GitOps Argo CD Applications are created. Repo creation uses GITEA_TOKEN
  # (Secret); the Application is created as the signed-in user.
  GITEA_ORG: "platform"
  ARGOCD_NAMESPACE: "argocd"
  ARGOCD_PROJECT: "default"
  SCAFFOLD_DEST_NAMESPACE: "default"

  # OpenCost / Kubecost allocation API (Decide → cost/spend). In-cluster this is
  # the opencost service on its API port; no auth by default.
  OPENCOST_URL: "http://opencost.opencost.svc:9003"

  # LGTM (Discover phase).
  GRAFANA_URL: "https://grafana.adhar.localtest.me:8443"
  LOKI_URL: "https://loki.adhar.localtest.me:8443"
  MIMIR_URL: "https://mimir.adhar.localtest.me:8443"
  TEMPO_URL: "https://tempo.adhar.localtest.me:8443"
  PROMETHEUS_URL: "https://prometheus.adhar.localtest.me:8443"
