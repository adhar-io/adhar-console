# Self-contained Postgres for the console's own state — a FALLBACK for clusters
# without Crossplane. Prefer database-claim.yaml (Crossplane Database) in
# production. Not included by kustomization.yaml by default; add it there or
# `kubectl apply -f` this file explicitly.
#
# The DATABASE_URL the console consumes for this StatefulSet is:
#   postgres://adhar:<password>@adhar-console-db:5432/adhar_console
apiVersion: v1
kind: Secret
metadata:
  name: adhar-console-db
  namespace: adhar-console
  labels:
    app.kubernetes.io/name: adhar-console-db
type: Opaque
stringData:
  POSTGRES_DB: adhar_console
  POSTGRES_USER: adhar
  # Replace before applying; or manage via External Secrets / SOPS.
  POSTGRES_PASSWORD: "replace-me"
---
apiVersion: v1
kind: Service
metadata:
  name: adhar-console-db
  namespace: adhar-console
  labels:
    app.kubernetes.io/name: adhar-console-db
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: adhar-console-db
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: adhar-console-db
  namespace: adhar-console
  labels:
    app.kubernetes.io/name: adhar-console-db
spec:
  serviceName: adhar-console-db
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: adhar-console-db
  template:
    metadata:
      labels:
        app.kubernetes.io/name: adhar-console-db
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        fsGroup: 999
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - name: postgres
              containerPort: 5432
          envFrom:
            - secretRef:
                name: adhar-console-db
          env:
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          readinessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U $POSTGRES_USER -d $POSTGRES_DB"]
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U $POSTGRES_USER -d $POSTGRES_DB"]
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 5Gi
