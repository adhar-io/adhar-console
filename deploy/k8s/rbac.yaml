# RBAC for the Platform module. Scope is broad (read-most, exec pods) because
# the console is a cluster admin tool. Tighten once per-tenant auth impersonation
# ships — at that point the console SA should only carry a short-lived user
# token obtained via the TokenReview + TokenRequest APIs.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: adhar-console-reader
  labels:
    app.kubernetes.io/name: adhar-console
rules:
  - apiGroups: [""]
    resources:
      - namespaces
      - nodes
      - pods
      - pods/log
      - services
      - endpoints
      - configmaps
      - secrets
      - events
      - persistentvolumes
      - persistentvolumeclaims
      - serviceaccounts
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources:
      - deployments
      - statefulsets
      - daemonsets
      - replicasets
    verbs: ["get", "list", "watch", "patch"]
  - apiGroups: ["batch"]
    resources: ["jobs", "cronjobs"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingresses", "networkpolicies"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["gateway.networking.k8s.io"]
    resources: ["gateways", "httproutes", "grpcroutes"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["storage.k8s.io"]
    resources: ["storageclasses", "volumeattachments"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: ["roles", "rolebindings", "clusterroles", "clusterrolebindings"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apiextensions.k8s.io"]
    resources: ["customresourcedefinitions"]
    verbs: ["get", "list", "watch"]
  # Adhar stack CRDs
  - apiGroups: ["argoproj.io"]
    resources: ["applications", "appprojects", "applicationsets", "workflows", "cronworkflows", "workflowtemplates", "rollouts", "experiments", "analysisruns", "analysistemplates"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["kargo.akuity.io"]
    resources: ["projects", "warehouses", "stages", "freights", "promotions"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apiextensions.crossplane.io", "pkg.crossplane.io"]
    resources: ["*"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["kyverno.io", "wgpolicyk8s.io"]
    resources: ["*"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: adhar-console-reader
  labels:
    app.kubernetes.io/name: adhar-console
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: adhar-console-reader
subjects:
  - kind: ServiceAccount
    name: adhar-console
    namespace: adhar-console
---
# Tenant provisioner — the ELEVATED grant that lets onboarding create a real,
# isolated tenant (see app/server/tenant-provisioner.ts): a namespace + a
# RoleBinding of the `org-<slug>` group to the namespaced `admin` ClusterRole,
# and a scoped ArgoCD AppProject. This is high-privilege (namespace + RBAC
# creation) — keep it as a SEPARATE role so it can be reviewed/omitted
# independently of the read-only reader role above. Without it the provisioner
# degrades honestly (each step reports "failed/permission" and the org is still
# created). On the platform install the subject is the `console` SA in
# `adhar-system`; adjust name/namespace to match your deployment.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: adhar-console-tenant-provisioner
  labels:
    app.kubernetes.io/name: adhar-console
    app.kubernetes.io/component: provisioner
rules:
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["create", "get", "list", "watch", "update", "patch"]
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: ["rolebindings", "roles"]
    verbs: ["create", "get", "list", "update", "patch"]
  - apiGroups: ["argoproj.io"]
    resources: ["appprojects"]
    verbs: ["create", "get", "list", "update", "patch"]
  # Required to grant the built-in `admin` ClusterRole via a RoleBinding
  # (Kubernetes privilege-escalation prevention).
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: ["clusterroles"]
    verbs: ["bind"]
    resourceNames: ["admin"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: adhar-console-tenant-provisioner
  labels:
    app.kubernetes.io/name: adhar-console
    app.kubernetes.io/component: provisioner
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: adhar-console-tenant-provisioner
subjects:
  - kind: ServiceAccount
    name: adhar-console
    namespace: adhar-console
