# RBAC for the Platform module. Scope is broad (read-most, exec pods) because
# the console is a cluster admin tool. Tighten once per-tenant auth impersonation
# ships — at that point the console SA should only carry a short-lived user
# token obtained via the TokenReview + TokenRequest APIs.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: adhar-console-reader
  labels:
    app.kubernetes.io/name: adhar-console
rules:
  - apiGroups: [""]
    resources:
      - namespaces
      - nodes
      - pods
      - pods/log
      - services
      - endpoints
      - configmaps
      - secrets
      - events
      - persistentvolumes
      - persistentvolumeclaims
      - serviceaccounts
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources:
      - deployments
      - statefulsets
      - daemonsets
      - replicasets
    verbs: ["get", "list", "watch", "patch"]
  - apiGroups: ["batch"]
    resources: ["jobs", "cronjobs"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingresses", "networkpolicies"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["gateway.networking.k8s.io"]
    resources: ["gateways", "httproutes", "grpcroutes"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["storage.k8s.io"]
    resources: ["storageclasses", "volumeattachments"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: ["roles", "rolebindings", "clusterroles", "clusterrolebindings"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apiextensions.k8s.io"]
    resources: ["customresourcedefinitions"]
    verbs: ["get", "list", "watch"]
  # Adhar stack CRDs
  - apiGroups: ["argoproj.io"]
    resources: ["applications", "appprojects", "applicationsets", "workflows", "cronworkflows", "workflowtemplates", "rollouts", "experiments", "analysisruns", "analysistemplates"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["kargo.akuity.io"]
    resources: ["projects", "warehouses", "stages", "freights", "promotions"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apiextensions.crossplane.io", "pkg.crossplane.io"]
    resources: ["*"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["kyverno.io", "wgpolicyk8s.io"]
    resources: ["*"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: adhar-console-reader
  labels:
    app.kubernetes.io/name: adhar-console
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: adhar-console-reader
subjects:
  - kind: ServiceAccount
    name: adhar-console
    namespace: adhar-console
