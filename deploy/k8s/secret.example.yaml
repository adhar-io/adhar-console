# Rename to secret.yaml and fill in real values before applying. Do NOT commit
# the rendered version. In production drive this via External Secrets Operator
# or SOPS-encrypted manifests.
apiVersion: v1
kind: Secret
metadata:
  name: adhar-console-secrets
  namespace: adhar-console
  labels:
    app.kubernetes.io/name: adhar-console
type: Opaque
stringData:
  # ── Required for SSO ──────────────────────────────────────────────────────
  # Confidential OIDC client secret from the Keycloak 'adhar-console' client.
  AUTH_CLIENT_SECRET: "replace-me"
  # Signs the session + OIDC transaction cookies (HS256). Must be >= 32 chars
  # and identical across all replicas. Generate: `openssl rand -base64 48`.
  AUTH_COOKIE_SECRET: "replace-me-with-a-long-random-string-min-32-chars"

  # ── Postgres (console's own state — preferences, notification state, …) ────
  # Prod: prefer wiring this from the Crossplane Database claim's connection
  # Secret (see database-claim.yaml) instead of hardcoding here. Format:
  #   postgres://USER:PASSWORD@HOST:5432/DBNAME
  DATABASE_URL: "postgres://adhar:adhar@adhar-console-db:5432/adhar_console"
  # DATABASE_SSL: "true"   # set when the DB requires TLS

  # ── Optional backing-tool service tokens ──────────────────────────────────
  # Used when a tool's registry entry runs in `service` auth mode (the console
  # calls server-to-server on the user's behalf) instead of forwarding the
  # user's Keycloak access token. Leave blank to disable that tool.
  GITEA_TOKEN: ""
  ARGOCD_TOKEN: ""
  KARGO_TOKEN: ""
  HARBOR_TOKEN: ""
  ARGO_WORKFLOWS_TOKEN: ""
  ARGO_ROLLOUTS_TOKEN: ""
  PLANE_TOKEN: ""
  GRAFANA_TOKEN: ""
  METABASE_TOKEN: ""
  AIRBYTE_TOKEN: ""
  POSTHOG_TOKEN: ""
  CODER_TOKEN: ""
  # K8S_SA_TOKEN is normally NOT set — the in-cluster projected service-account
  # token is read automatically. Set it only for out-of-cluster / impersonation.
  # K8S_SA_TOKEN: ""
