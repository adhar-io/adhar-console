apiVersion: v1
kind: Service
metadata:
  name: adhar-console
  namespace: adhar-console
  labels:
    app.kubernetes.io/name: adhar-console
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
  selector:
    app.kubernetes.io/name: adhar-console
    app.kubernetes.io/component: shell
