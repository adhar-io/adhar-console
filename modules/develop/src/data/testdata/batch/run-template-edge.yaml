apiVersion: batch/v1
kind: Job
metadata:
  annotations:
    adhar.io/batch-actor: ""
  labels:
    adhar.io/application: importer
    adhar.io/batch-job: importer
    adhar.io/batch-role: single
    adhar.io/batch-trigger: manual
    adhar.io/environment: prod
    adhar.io/organisation: acme
    adhar.io/plane: workload
    adhar.io/project: shop
    adhar.io/team: data
    adhar.io/workload: batch
    app.kubernetes.io/name: importer
  namespace: shop-prod
spec:
  activeDeadlineSeconds: 21600
  backoffLimit: 2
  completions: 1
  parallelism: 1
  podFailurePolicy:
    rules:
    - action: Ignore
      onPodConditions:
      - status: "True"
        type: DisruptionTarget
    - action: FailJob
      onExitCodes:
        containerName: batch
        operator: In
        values:
        - 2
        - 3
        - 4
        - 6
        - 7
  podReplacementPolicy: Failed
  template:
    metadata:
      annotations:
        adhar.io/batch-actor: ""
        cluster-autoscaler.kubernetes.io/safe-to-evict: "false"
      labels:
        adhar.io/application: importer
        adhar.io/batch-job: importer
        adhar.io/batch-role: single
        adhar.io/batch-trigger: manual
        adhar.io/environment: prod
        adhar.io/organisation: acme
        adhar.io/plane: workload
        adhar.io/project: shop
        adhar.io/team: data
        adhar.io/workload: batch
        app.kubernetes.io/name: importer
    spec:
      containers:
      - env:
        - name: ADHAR_BATCH_JOB
          value: importJob
        - name: ADHAR_BATCH_NAME
          value: importer
        - name: ADHAR_BATCH_ROLE
          value: single
        - name: ADHAR_BATCH_TRIGGER
          value: manual
        - name: ADHAR_BATCH_PARAMS
          value: '{}'
        - name: ADHAR_BATCH_TIME_ZONE
          value: Asia/Singapore
        - name: ADHAR_BATCH_REPOSITORY_SCHEMA
          value: batch
        - name: ADHAR_BATCH_SHUTDOWN_TIMEOUT
          value: 90s
        - name: ADHAR_BATCH_K8S_JOB
          valueFrom:
            fieldRef:
              apiVersion: v1
              fieldPath: metadata.labels['batch.kubernetes.io/job-name']
        - name: ADHAR_BATCH_ACTOR
          valueFrom:
            fieldRef:
              apiVersion: v1
              fieldPath: metadata.annotations['adhar.io/batch-actor']
        - name: POD_NAME
          valueFrom:
            fieldRef:
              apiVersion: v1
              fieldPath: metadata.name
        - name: SPRING_DATASOURCE_URL
          valueFrom:
            secretKeyRef:
              key: jdbc-uri
              name: importer-db-app
        - name: BPL_JVM_THREAD_COUNT
          value: "50"
        - name: JAVA_TOOL_OPTIONS
          value: -XX:ReservedCodeCacheSize=64M -Dfoo="bar baz" -Dpath=C:\tmp
        - name: OTEL_EXPORTER_OTLP_ENDPOINT
          value: http://alloy.adhar-system.svc.cluster.local:4318
        - name: OTEL_RESOURCE_ATTRIBUTES
          value: deployment.environment.name=prod,deployment.environment=prod,service.namespace=shop-prod
        - name: FEATURE_FLAG
          value: "true"
        - name: NUMERIC_LOOKING
          value: "0123"
        - name: A_COLON
          value: 'a: b'
        - name: A_HASH
          value: 'a #b'
        - name: MULTI
          value: |-
            line1
            line2
        envFrom:
        - secretRef:
            name: importer-inbound-bucket
        image: harbor-core.adhar-system.svc.cluster.local/library/importer@sha256:7f3c1a9d2e4b5f60718293a4b5c6d7e8f9001122334455667788990011223344
        name: batch
        resources:
          limits:
            memory: 1536Mi
          requests:
            cpu: "1"
            memory: 1536Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
        volumeMounts:
        - mountPath: /tmp
          name: tmp
      enableServiceLinks: false
      imagePullSecrets:
      - name: harbor-dockercfg
      priorityClassName: adhar-batch
      restartPolicy: Never
      schedulerName: default-scheduler
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      serviceAccountName: importer-batch
      terminationGracePeriodSeconds: 120
      volumes:
      - emptyDir:
          sizeLimit: 1Gi
        name: tmp
  ttlSecondsAfterFinished: 604800
