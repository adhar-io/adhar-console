# `depends` that is not a plain conjunction, a sub-flow, and a leaf exit handler.
apiVersion: argoproj.io/v1alpha1
kind: ClusterWorkflowTemplate
metadata:
  name: expression-depends
spec:
  entrypoint: main
  onExit: cleanup
  templates:
    - name: main
      dag:
        tasks:
          - name: primary
            template: work
          - name: fallback
            template: work
            depends: primary.Failed || primary.Errored
          - name: publish
            template: fan     # a nested DAG: drawn as one group node
            depends: "(primary || fallback) && !fallback.Errored"
          - name: audit
            template: work
            depends: publish.AnySucceeded
    - name: fan
      dag:
        tasks:
          - name: east
            template: work
          - name: west
            template: work
          - name: join
            template: work
            depends: east && west
    - name: work
      container:
        image: docker.io/library/busybox:1.37
        command: [sh, -c, "true"]
        resources:
          requests: {cpu: 10m, memory: 16Mi}
          limits: {cpu: 50m, memory: 32Mi}
    - name: cleanup
      container:
        image: docker.io/library/busybox:1.37
        command: [sh, -c, "echo {{workflow.status}}"]
        resources:
          requests: {cpu: 10m, memory: 16Mi}
          limits: {cpu: 50m, memory: 32Mi}
