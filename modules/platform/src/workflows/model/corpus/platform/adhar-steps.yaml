# adhar-steps — the platform's general-purpose workflow steps (docs/design/0026
# §5.7, W2). A workflow calls one by reference, from any namespace:
#
#   templateRef: {name: adhar-steps, template: approval, clusterScope: true}
#
#   approval      a person decides (suspend); nothing runs while it waits
#   http-check    wait until a URL answers as expected (Argo's HTTP template)
#   wait-healthy  wait until a Deployment, StatefulSet, Rollout or Job is healthy
#   k6-load       a short k6 load test against a URL, its result as outputs
# (run-gameday arrives with G2.)
#
# Every step is pinned, sized and non-root. A step that runs adhar logic runs the
# platform image (stackTemplateData.PlatformImage, rendered at seed time), so the
# step and the control plane that seeded it are one release (D-19). Argo's own
# expressions are wrapped in a Go raw-string action here, because this file is
# a Go template first: a bare one would be rendered away at seed time (or fail
# the seed) instead of reaching Argo.
#
# Identity: every step runs as the WORKFLOW's ServiceAccount (`adhar-workflow`
# by default, §5.6), never one named here. In a team namespace that identity has
# `view` there and nothing elsewhere, so wait-healthy can wait only on the
# workflow's own namespace, and http-check and k6-load reach only what that
# namespace's NetworkPolicies let out.
#
# Only Argo CD writes ClusterWorkflowTemplates (adhar-cwt-platform-only); a team
# that needs a variant copies the template into a WorkflowTemplate of its own.
apiVersion: argoproj.io/v1alpha1
kind: ClusterWorkflowTemplate
metadata:
  name: adhar-steps
  labels:
    app.kubernetes.io/part-of: adhar-platform
    adhar.io/catalog: "true"
    # Dot-separated: a label value cannot hold a comma, and the API server
    # rejecting this one object held back the whole argo-workflows sync
    # (TestEveryStackLabelIsOneTheAPIServerAccepts). The console splits on , or .
    adhar.io/catalog-tags: approvals.checks.load
  annotations:
    workflows.argoproj.io/title: Platform steps
    workflows.argoproj.io/description: >-
      Approvals, HTTP checks, waiting for a workload to become healthy, and a
      k6 load test (design 0026 §5.7).
spec:
  templates:
    # ── approval ────────────────────────────────────────────────────────────
    # A suspend node that asks a question and records the answer. The console
    # and `adhar workflow approve|reject` decide it: they check the caller
    # against `approvers` and, when forbidSelfApproval is "true", against the
    # run's adhar.io/submitted-by, then supply the three outputs and resume the
    # node. A REJECTION IS AN OUTPUT, not a failure: the node succeeds either
    # way, and the steps it guards say so —
    #   when: "{{tasks.approve.outputs.parameters.decision}} == approve"
    # When `timeout` passes with no decision, Argo resumes the node with each
    # output's default (v4.1.6 executeSuspend → OverrideOutputParametersWithDefault),
    # so an unanswered approval is a REJECTION. An empty timeout waits until the
    # workflow's own deadline (6 h by default) fails the run.
    - name: approval
      metadata:
        annotations:
          adhar.io/node-kind: approval
          workflows.argoproj.io/title: Approval
          workflows.argoproj.io/description: >-
            Waits for a person to approve or reject, then records the decision,
            the approver and a comment as outputs. No answer before the timeout
            is a rejection.
      inputs:
        parameters:
          - name: question
            description: What the approver is asked.
            default: Approve this run?
          - name: approvers
            description: >-
              Who may decide: comma-separated Keycloak groups or usernames
              (group:/user: prefixes optional). Empty: anyone who may update the run.
            default: ""
          - name: timeout
            description: >-
              How long to wait for a decision (a duration, e.g. 30m, 4h). No
              decision by then is a rejection.
            default: 4h
          - name: forbidSelfApproval
            description: The person who submitted the run may not decide it.
            default: "true"
            enum: ["true", "false"]
      suspend:
        duration: "{{inputs.parameters.timeout}}"
      outputs:
        parameters:
          - name: decision
            description: approve or reject; reject when nobody decided in time.
            enum: [approve, reject]
            valueFrom:
              supplied: {}
              default: reject
          - name: approver
            description: Who decided, as the platform authenticated them; empty on a timeout.
            valueFrom:
              supplied: {}
              default: ""
          - name: comment
            description: What the approver wrote, if anything.
            valueFrom:
              supplied: {}
              default: ""

    # ── http-check ──────────────────────────────────────────────────────────
    # Argo's HTTP template: no pod per attempt. It runs in the workflow's agent
    # pod (one per workflow that uses HTTP steps, as the workflow's
    # ServiceAccount — adhar-workflow-executor grants its WorkflowTaskSet
    # rights), so it must be idempotent: a check, not a write. Each attempt
    # waits 30 s for an answer; attempts repeat every 10 s until
    # successCondition holds or `timeout` has passed.
    - name: http-check
      metadata:
        annotations:
          adhar.io/node-kind: http-check
          workflows.argoproj.io/title: HTTP check
          workflows.argoproj.io/description: >-
            Calls a URL until its answer satisfies the success condition, or
            gives up after the timeout.
      inputs:
        parameters:
          - name: url
            description: The URL to call, e.g. https://shop.dev.example.com/healthz.
          - name: method
            description: The HTTP method; a check should not change anything.
            default: GET
            enum: [GET, HEAD, POST]
          - name: successCondition
            description: >-
              An Argo expression over `response` (statusCode, body, headers)
              that must hold, e.g. response.statusCode == 200.
            default: response.statusCode >= 200 && response.statusCode < 300
          - name: body
            description: A request body, for a POST.
            default: ""
          - name: timeout
            description: Keep trying for this long (a duration) before failing the step.
            default: 5m
      http:
        url: "{{inputs.parameters.url}}"
        method: "{{inputs.parameters.method}}"
        body: "{{inputs.parameters.body}}"
        # An int64 in Argo's schema, so it cannot come from a parameter.
        timeoutSeconds: 30
        successCondition: "{{inputs.parameters.successCondition}}"
      retryStrategy:
        # The limit is a ceiling the timeout always reaches first (10 s apart,
        # an hour of attempts); maxDuration is what ends the step.
        limit: 360
        retryPolicy: Always
        backoff:
          duration: 10s
          factor: 1
          maxDuration: "{{inputs.parameters.timeout}}"

    # ── wait-healthy ────────────────────────────────────────────────────────
    # `adhar workflow wait` on the platform image: reads the object with the
    # workflow's own identity (`view` in its namespace) until it is healthy, and
    # fails at once when it can no longer become so — a Job that failed, a
    # Deployment past its progress deadline, a Rollout that was aborted. The
    # image has no shell; the command line is the whole contract.
    - name: wait-healthy
      metadata:
        annotations:
          adhar.io/node-kind: wait-healthy
          workflows.argoproj.io/title: Wait until healthy
          workflows.argoproj.io/description: >-
            Waits until a Deployment, StatefulSet, Argo Rollout or Job in the
            workflow's namespace is healthy, and fails if it cannot become so
            before the timeout.
      inputs:
        parameters:
          - name: kind
            description: What to wait for.
            enum: [Deployment, StatefulSet, Rollout, Job]
          - name: name
            description: Its name, in the workflow's namespace.
          - name: timeout
            description: Give up after this long (a Go duration).
            default: 10m
      retryStrategy:
        # Only a lost pod (OnError). "Not healthy in time" is the answer, and
        # asking again would only wait again.
        retryPolicy: OnError
        limit: 2
        backoff:
          duration: 10s
          factor: 2
      container:
        image: ghcr.io/adhar-io/adhar:0.0.0-corpus
        imagePullPolicy: IfNotPresent
        command: [/adhar]
        args:
          - workflow
          - wait
          - --kind
          - "{{inputs.parameters.kind}}"
          - --name
          - "{{inputs.parameters.name}}"
          - -n
          - "{{workflow.namespace}}"
          - --for
          - Healthy
          - "--timeout={{inputs.parameters.timeout}}"
          - -o
          - json
        env:
          # The root filesystem is read-only; anything the CLI caches goes here.
          - name: HOME
            value: /tmp
        resources:
          requests:
            cpu: 10m
            memory: 48Mi
          limits:
            cpu: 100m
            memory: 128Mi
        securityContext:
          runAsNonRoot: true
          runAsUser: 65532
          runAsGroup: 65532
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
              - ALL
          seccompProfile:
            type: RuntimeDefault
        volumeMounts:
          - name: tmp
            mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 16Mi

    # ── k6-load ─────────────────────────────────────────────────────────────
    # The resilience runner's generic load (adhar-scorecards
    # resilience-runner.yaml load.js): ramp to `vus` users, hold for `duration`,
    # with thresholds on p95 latency and the error rate. handleSummary prints
    # ONE marked line (ADHAR_K6_SUMMARY {json}) and writes the same summary as
    # the step's outputs. k6 exits 99 when a threshold fails; that is a RESULT,
    # so the step succeeds with thresholdsPassed "false" unless
    # failOnThresholds is "true". Any other non-zero exit (the script could not
    # run) fails the step.
    #
    # Parameters reach the script only as environment variables, never spliced
    # into its source (§6.6). The image is the runner's pin (k6 runs as its own
    # non-root user, 12345).
    - name: k6-load
      metadata:
        annotations:
          adhar.io/node-kind: k6
          workflows.argoproj.io/title: k6 load test
          workflows.argoproj.io/description: >-
            Runs a short k6 load test against a URL and reports p95 latency,
            the error rate and whether the thresholds held.
      inputs:
        parameters:
          - name: url
            description: The URL to load, e.g. https://shop.dev.example.com/.
          - name: vus
            description: Virtual users at the plateau.
            default: "10"
          - name: duration
            description: How long to hold the plateau (a k6 duration, e.g. 60s, 5m).
            default: 60s
          - name: p95Ms
            description: Threshold on p95 latency, in milliseconds.
            default: "500"
          - name: errorRate
            description: Threshold on the share of failed requests (0.01 = 1%).
            default: "0.01"
          - name: failOnThresholds
            description: Fail the step when a threshold does not hold.
            default: "false"
            enum: ["true", "false"]
      script:
        image: docker.io/grafana/k6:1.3.0
        imagePullPolicy: IfNotPresent
        command: [sh]
        env:
          - name: TARGET_URL
            value: "{{inputs.parameters.url}}"
          - name: VUS
            value: "{{inputs.parameters.vus}}"
          - name: DURATION
            value: "{{inputs.parameters.duration}}"
          - name: P95_MS
            value: "{{inputs.parameters.p95Ms}}"
          - name: ERROR_RATE
            value: "{{inputs.parameters.errorRate}}"
          - name: FAIL_ON_THRESHOLDS
            value: "{{inputs.parameters.failOnThresholds}}"
          - name: K6_NO_USAGE_REPORT
            value: "true"
          - name: HOME
            value: /tmp
        source: |
          set -u
          out=/tmp/adhar-k6
          mkdir -p "$out"
          cat > "$out/load.js" <<'K6'
          import http from 'k6/http';
          import { check, sleep } from 'k6';

          const target = __ENV.TARGET_URL;
          const vus = parseInt(__ENV.VUS || '10', 10);
          const p95 = parseInt(__ENV.P95_MS || '500', 10);
          const errRate = parseFloat(__ENV.ERROR_RATE || '0.01');

          export const options = {
            scenarios: {
              load: {
                executor: 'ramping-vus',
                startVUs: 1,
                stages: [
                  { duration: '15s', target: vus },
                  { duration: __ENV.DURATION || '60s', target: vus },
                  { duration: '5s', target: 0 },
                ],
                gracefulRampDown: '5s',
              },
            },
            thresholds: {
              http_req_duration: [`p(95)<${p95}`],
              http_req_failed: [`rate<${errRate}`],
            },
            summaryTrendStats: ['avg', 'med', 'p(95)', 'p(99)', 'max'],
            userAgent: 'adhar-steps/k6',
          };

          export default function () {
            const res = http.get(target, { tags: { name: 'target' }, timeout: '10s' });
            check(res, { 'status is 2xx': (r) => r.status >= 200 && r.status < 300 });
            sleep(0.05);
          }

          export function handleSummary(data) {
            const m = data.metrics;
            const d = (m.http_req_duration && m.http_req_duration.values) || {};
            const f = (m.http_req_failed && m.http_req_failed.values) || {};
            const r = (m.http_reqs && m.http_reqs.values) || {};
            let ok = true;
            for (const k of Object.keys(m)) {
              const t = m[k].thresholds || {};
              for (const name of Object.keys(t)) if (!t[name].ok) ok = false;
            }
            const out = {
              thresholdsPassed: ok,
              p95Ms: d['p(95)'], p99Ms: d['p(99)'], avgMs: d.avg, maxMs: d.max,
              errorRate: f.rate, requests: r.count, rps: r.rate, vus,
            };
            const json = JSON.stringify(out);
            return {
              stdout: 'ADHAR_K6_SUMMARY ' + json + '\n',
              '/tmp/adhar-k6/summary.json': json,
              '/tmp/adhar-k6/thresholds-passed': String(ok),
            };
          }
          K6
          k6 run --quiet --no-color "$out/load.js"
          code=$?
          if [ "$code" -eq 99 ] && [ "$FAIL_ON_THRESHOLDS" != "true" ]; then
            exit 0
          fi
          exit "$code"
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: "1"
            memory: 512Mi
        securityContext:
          runAsNonRoot: true
          runAsUser: 12345
          runAsGroup: 12345
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
              - ALL
          seccompProfile:
            type: RuntimeDefault
        volumeMounts:
          - name: tmp
            mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 32Mi
      outputs:
        parameters:
          - name: thresholdsPassed
            description: '"true" when p95 latency and the error rate held their thresholds.'
            valueFrom:
              path: /tmp/adhar-k6/thresholds-passed
              default: "false"
          - name: summary
            description: >-
              The run as JSON: thresholdsPassed, p95Ms, p99Ms, avgMs, maxMs,
              errorRate, requests, rps, vus.
            valueFrom:
              path: /tmp/adhar-k6/summary.json
              default: "{}"
